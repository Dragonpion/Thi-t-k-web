<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — MewTea Luxury Tea & Cafe</title>
  <meta name="description" content="Đăng nhập vào tài khoản MewTea để tích điểm thành viên, nhận voucher độc quyền và đặt những ly trà sữa thủ công thượng hạng.">

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/Login.css">
  <style>
    @font-face {
      font-family: "MewFont" ;
      src: url("assets/Font/MewFont.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
  }
  </style>
</head>
<body>

  <div class="login-container">

    <!-- Right Login Area -->
    <main class="form-side">
      <article class="login-card">
        <header class="card-header">
          <div class="logo"><img src="assets/Logo/MT.png" alt="Logo"></div>
          <div class="logo">Mew<span>Tea</span></div>
          <h2>Chào mừng trở lại</h2>
          <p>Đăng nhập để tiếp tục mua sắm.</p>
        </header>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          
          <!-- Email Input -->
          <div class="form-group" id="emailGroup">
            <label for="email" class="form-label">Email</label>
            <div class="input-wrapper">
              <input 
                type="email" 
                id="email" 
                class="form-input" 
                placeholder="example@gmail.com" 
                required 
                autocomplete="email"
                aria-describedby="emailError"
              >
              <i class="fa-regular fa-envelope input-icon" aria-hidden="true"></i>
            </div>
            <span class="error-text" id="emailError" role="alert">
              <i class="fa-solid fa-circle-exclamation"></i> Email không hợp lệ
            </span>
          </div>

          <!-- Password Input -->
          <div class="form-group" id="passwordGroup">
            <label for="password" class="form-label">Mật khẩu</label>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="password" 
                class="form-input" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
                aria-describedby="passwordError"
              >
              <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
              <button type="button" id="togglePassword" class="password-toggle" aria-label="Hiển thị mật khẩu">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <span class="error-text" id="passwordError" role="alert">
              <i class="fa-solid fa-circle-exclamation"></i> Mật khẩu phải chứa ít nhất 6 ký tự
            </span>
          </div>

          <!-- Options -->
          <div class="form-options">
            <label class="remember-label">
              <input type="checkbox" class="remember-checkbox" id="remember">
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="forgot-link">Quên mật khẩu?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-login" id="submitBtn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-text">Đăng nhập</span>
          </button>
        </form>

        <div class="divider">Hoặc</div>

        <!-- Social Connections -->
        <div class="social-grid">
          <button type="button" class="btn-social" aria-label="Đăng nhập bằng Google">
            <i class="fa-brands fa-google"></i>
          </button>
          <button type="button" class="btn-social" aria-label="Đăng nhập bằng Facebook">
            <i class="fa-brands fa-facebook-f"></i>
          </button>
          <button type="button" class="btn-social" aria-label="Đăng nhập bằng Apple">
            <i class="fa-brands fa-apple"></i>
          </button>
        </div>

        <div class="register-prompt">
          Chưa có tài khoản? <a href="#" class="register-link">Đăng ký ngay</a>
        </div>

        <!-- Tiny Footer -->
        <footer class="small-footer">
          Bằng việc đăng nhập bạn đồng ý với <br>
          <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a> của MewTea.
        </footer>
      </article>
    </main>

  </div>

  <!-- Smooth Client-Side Operations Script -->
  <script src="assets/js/Login.js"></script>

</body>
</html>
